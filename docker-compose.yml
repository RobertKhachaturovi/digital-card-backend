name: digital-card-backend

services:
  db:
    image: postgres:16-alpine
    container_name: digital_card_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: digital_card
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: digital_card_app
    restart: always
    ports:
      - '3000:3000'
    environment:
      PORT: 3000
      DATABASE_URL: 'postgresql://postgres:postgres@db:5432/digital_card?schema=public'
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
